plugins {
    id 'com.android.application'
}

def vcpkgRoot = System.getenv('VCPKG_ROOT')
def pinnedNdkVersion = '27.0.12077973'
def androidNdkHome = System.getenv('ANDROID_NDK_HOME')

// Fallback auto-discovery for ANDROID_NDK_HOME if not set in environment
if (!androidNdkHome) {
    def userHome = System.getProperty("user.home")
    def defaultNdk = new File(userHome, "Library/Android/sdk/ndk/${pinnedNdkVersion}")
    if (defaultNdk.exists()) {
        androidNdkHome = defaultNdk.absolutePath
    }
}

// Fallback auto-discovery for VCPKG_ROOT if not set in environment
if (!vcpkgRoot) {
    def rootVcpkg = new File(rootProject.projectDir, "../vcpkg")
    if (rootVcpkg.exists()) {
        vcpkgRoot = rootVcpkg.absolutePath
    }
}

android {
    namespace "me.hirameki.kotonoha"
    compileSdk 34

    defaultConfig {
        applicationId "me.hirameki.kotonoha"
        minSdk 28
        versionCode 1
        versionName "1.0"
        targetSdk 34

        externalNativeBuild {
            cmake {
                arguments(
                        "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                        "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${androidNdkHome}/build/cmake/android.toolchain.cmake",
                        "-DANDROID_STL=c++_shared",
                        "-DCMAKE_IGNORE_PATH=${androidNdkHome}/toolchains/llvm/prebuilt/windows-x86_64/lib"
                )
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    flavorDimensions "game"

    productFlavors {
        generic {
            dimension "game"
            applicationId "me.hirameki.kotonoha"
            versionName "1.0"
            buildConfigField "String", "DEFAULT_TARGET", "\"Kotonoha\""
            externalNativeBuild {
                cmake {
                    arguments "-DKOTONOHA_GAME=generic"
                }
            }
        }

        schoolDays {
            dimension "game"
            applicationId "me.hirameki.kotonoha.schooldayshq"
            versionName "1.02-test"
            buildConfigField "String", "DEFAULT_TARGET", "\"SchoolDays\""
            externalNativeBuild {
                cmake {
                    arguments "-DKOTONOHA_GAME=school-days"
                }
            }
        }

        dokiDoki {
            dimension "game"
            applicationId "me.hirameki.kotonoha.ddlc"
            versionName "1.0"
            buildConfigField "String", "DEFAULT_TARGET", "\"DokiDoki\""
            externalNativeBuild {
                cmake {
                    arguments "-DKOTONOHA_GAME=doki-doki-literature-club"
                }
            }
        }

        zeroNoTsukaima {
            dimension "game"
            applicationId "me.hirameki.kotonoha.zero"
            versionName "1.0"
            buildConfigField "String", "DEFAULT_TARGET", "\"ZeroNoTsukaima\""
            externalNativeBuild {
                cmake {
                    arguments "-DKOTONOHA_GAME=zero-no-tsukaima"
                }
            }
        }

        snowRadish {
            dimension "game"
            applicationId "me.hirameki.kotonoha.snowradish"
            versionName "1.0"
            buildConfigField "String", "DEFAULT_TARGET", "\"SnowRadish\""
            externalNativeBuild {
                cmake {
                    arguments "-DKOTONOHA_GAME=snow-radish-vacation"
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
            assets.srcDirs = ['../../assets']
        }
        generic {
            manifest.srcFile '../../games/generic/android/AndroidManifest.xml'
            assets.srcDirs = ['../../assets', '../../games/generic/assets']
        }
        schoolDays {
            manifest.srcFile '../../games/school-days/android/AndroidManifest.xml'
            java.srcDir '../../games/school-days/android/java'
            res.srcDir '../../games/school-days/android/res'
            assets.srcDirs = ['../../games/school-days/android/assets', '../../assets', '../../games/school-days/assets']
        }
        dokiDoki {
            manifest.srcFile '../../games/doki-doki-literature-club/android/AndroidManifest.xml'
            res.srcDir '../../games/doki-doki-literature-club/android/res'
            assets.srcDirs = ['../../assets', '../../games/doki-doki-literature-club/assets']
        }
        zeroNoTsukaima {
            manifest.srcFile '../../games/zero-no-tsukaima/android/AndroidManifest.xml'
            res.srcDir '../../games/zero-no-tsukaima/android/res'
            assets.srcDirs = ['../../assets', '../../games/zero-no-tsukaima/assets']
        }
        snowRadish {
            manifest.srcFile '../../games/snow-radish-vacation/android/AndroidManifest.xml'
            res.srcDir '../../games/snow-radish-vacation/android/res'
            assets.srcDirs = ['../../assets', '../../games/snow-radish-vacation/assets']
        }
    }

    lint {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    ndkVersion pinnedNdkVersion
    buildToolsVersion '37.0.0'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:support-vector-drawable:28.0.0'
    implementation 'android.arch.lifecycle:livedata:1.1.1'
    implementation 'android.arch.lifecycle:viewmodel:1.1.1'
    implementation 'android.arch.navigation:navigation-fragment:1.0.0'
    implementation 'android.arch.navigation:navigation-ui:1.0.0'
    implementation 'com.android.support:design:28.0.0'
}

tasks.register('unitTestClasses') {
    description = "Assembles unit test classes."
    group = "Verification"
    dependsOn tasks.matching { it.name.startsWith('compile') && it.name.endsWith('UnitTestSources') }
}

tasks.register('testClasses') {
    description = "Assembles test classes."
    group = "Verification"
    dependsOn tasks.named('unitTestClasses')
}
