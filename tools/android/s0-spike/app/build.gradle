plugins {
    id 'com.android.application'
}

android {
    namespace 'org.kotonoha.schooldays.safspike'
    compileSdk 36

    defaultConfig {
        applicationId 'org.kotonoha.schooldays.safspike'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1.0-s0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
