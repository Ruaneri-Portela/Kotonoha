import java.awt.AlphaComposite
import java.awt.Color
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.geom.Ellipse2D
import java.awt.image.BufferedImage
import java.io.ByteArrayInputStream
import java.nio.ByteBuffer
import java.nio.ByteOrder
import java.security.MessageDigest
import javax.imageio.ImageIO

plugins {
  id 'com.android.application'
}

// ------------------------------------------------------------
// Project paths and configuration
// ------------------------------------------------------------

def engineRoot = rootProject.projectDir.parentFile.parentFile
def sdlRoot = new File(engineRoot, 'lib/submodules/SDL')
def sdlTtfRoot = new File(engineRoot, 'lib/submodules/SDL_ttf')
def imguiRoot = new File(engineRoot, 'lib/submodules/imgui')
def sdlJavaRoot = new File(sdlRoot, 'android-project/app/src/main/java')
def vcpkgRoot = providers.environmentVariable('VCPKG_ROOT').orNull

// The SDL Android glue is part of the SDL source checkout, not vcpkg.
// Fail fast before CMake or Java compilation if a submodule is incomplete.
[
  new File(sdlRoot, 'CMakeLists.txt'),
  new File(sdlTtfRoot, 'CMakeLists.txt'),
  new File(imguiRoot, 'imgui.cpp'),
  new File(imguiRoot, 'backends/imgui_impl_sdl3.cpp'),
  new File(imguiRoot, 'backends/imgui_impl_sdlrenderer3.cpp'),
  new File(sdlJavaRoot, 'org/libsdl/app/SDLActivity.java'),
  new File(sdlJavaRoot, 'org/libsdl/app/SDLSurface.java')
].each { source ->
  if (!source.isFile()) {
    throw new GradleException("Missing SDL/SDL_ttf/ImGui submodule source: ${source}. Run git submodule update --init --recursive.")
  }
}

if (!vcpkgRoot) {
  throw new GradleException('Set VCPKG_ROOT to your vcpkg checkout before opening Android.')
}

if (!new File(vcpkgRoot, 'scripts/buildsystems/vcpkg.cmake').isFile()) {
  throw new GradleException("Invalid VCPKG_ROOT: ${vcpkgRoot}")
}

// Retail game files are never silently included in a distributable APK.
// Developers may explicitly bundle authorized local data for private testing.
def includeGameAssets = providers.gradleProperty('bundleGameAssets')
  .orElse('false').get().toBoolean()
if (includeGameAssets) {
  logger.warn('[Kotonoha] bundleGameAssets=true: do not redistribute APKs containing commercial game data without permission.')
}

// Optional local SDK; never commit the proprietary AAR or SDK path.
def discordSdkRoot = providers.gradleProperty('discordSocialSdkDir').orNull
def discordAar = discordSdkRoot ? new File(discordSdkRoot, 'lib/release/discord_partner_sdk.aar') : null
if (discordAar != null && !discordAar.isFile()) {
  throw new GradleException("Discord Social SDK AAR not found: ${discordAar}")
}
def discordNative = layout.buildDirectory.dir('generated/discordPresenceSdk')

// Optional, hash-checked private options artwork compiled into the native
// School Days binary. Do not bundle retail-derived edits for public releases.
def schoolDaysDisplayOverlaySource = providers.gradleProperty('schoolDaysDisplayOverlaySource')
  .orElse('').get()
def schoolDaysRequireEmbeddedOverlay = providers.gradleProperty('schoolDaysRequireEmbeddedOverlay')
  .orElse('false').get().toBoolean()
def schoolDaysEmbedPrivateOptionArt = providers.gradleProperty('schoolDaysEmbedPrivateOptionArt')
  .orElse('false').get().toBoolean()

def rawAbis = providers.gradleProperty('abis')
  .orElse('arm64-v8a,armeabi-v7a,x86_64').get().split(',').toList()

def abis = rawAbis.collect { abi ->
  def cleanAbi = abi.trim().toLowerCase(Locale.ROOT)
  if (cleanAbi == 'arm64' || cleanAbi == 'aarch64') return 'arm64-v8a'
  if (cleanAbi in ['armv7', 'armv7a', 'arm-neon', 'arm-neon-android']) return 'armeabi-v7a'
  if (cleanAbi == 'amd64' || cleanAbi == 'x64') return 'x86_64'
  return cleanAbi
}.unique()

def supportedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
if (abis.isEmpty() || !supportedAbis.containsAll(abis)) {
  throw new GradleException("Unsupported Android ABIs: ${abis}. Supported: ${supportedAbis}")
}

// Format: CMake game ID, native target, application ID, display name.
def games = [
  example       : ['example', 'Kotonoha', 'org.kotonoha.example', 'Kotonoha'],
  amagami       : ['amagami', 'Amagami', 'me.hirameki.kotonoha.amagami', 'Amagami'],
  zeroNoTsukaima: ['zero-no-tsukaima', 'ZeroNoTsukaima', 'me.hirameki.kotonoha.zeronotsukaima', 'Zero no Tsukaima'],
  snowRadish    : ['snow-radish-vacation', 'SnowRadish', 'me.hirameki.kotonoha.snowradishvacation', 'Snow Radish Vacation!!'],
  meo           : ['meo', 'MEO', 'me.hirameki.kotonoha.meo', 'Miss Each Other'],
  katawaShoujo  : ['katawa-shoujo', 'KatawaShoujo', 'me.hirameki.kotonoha.katawashoujo', 'Katawa Shoujo'],
  dokiDoki      : ['doki-doki-literature-club', 'DokiDoki', 'me.hirameki.kotonoha.dokidokiliteratureclub', 'Doki Doki Literature Club!'],
  schoolDays    : ['school-days', 'SchoolDays', 'me.hirameki.kotonoha.schooldays', 'School Days'],
  reallive      : ['reallive', 'RealLive', 'me.hirameki.kotonoha.reallive', 'RealLive'],
  summerRadish  : ['summer-radish-vacation', 'SummerRadish', 'me.hirameki.kotonoha.summerradishvacation', 'Summer Radish Vacation!!'],
  kirikiri      : ['kirikiri', 'Kirikiri', 'me.hirameki.kotonoha.kirikiri', 'KiriKiri'],
  lucaSystem    : ['luca-system', 'LucaSystem', 'me.hirameki.kotonoha.lucasystem', 'Luca System'],
  pmail         : ['pmail', 'Pmail', 'me.hirameki.kotonoha.pmail', 'Pure Mail'],
  ponscripter   : ['ponscripter', 'PonscripterGame', 'me.hirameki.kotonoha.ponscripter', 'PONscripter'],
  n2System      : ['n2system', 'N2SystemGame', 'me.hirameki.kotonoha.n2system', 'N2System Game'],
  artemis       : ['artemis', 'ArtemisGame', 'me.hirameki.kotonoha.artemis', 'Artemis Engine'],
  // The Material launcher flavor consumes only the JNI core: the SDL app target
  // (KotonohaLauncher) is built exclusively by native/desktop configurations.
  launcher      : ['all', 'KotonohaLauncherCore', 'me.hirameki.kotonoha', 'Kotonoha']
]

// Shared Material 3 launcher artwork lives in the versioned design/generated/
// source of truth. Gradle only imports it into res/; it never packages the
// design/ folder as a generic asset and never generates into a build dir.
def brandOutput = new File(engineRoot, 'design/generated')
def generateBranding = tasks.register('generateKotonohaBranding', Exec) {
  def generator = new File(engineRoot, 'tools/generate_brand_assets.py')
  inputs.file(generator)
  // Declare one concrete output instead of outputs.dir(): design/ files are
  // versioned and must never be removed by a Gradle clean.
  outputs.file(new File(brandOutput, 'android/res/mipmap-mdpi/ic_launcher.png'))
  commandLine providers.environmentVariable('PYTHON').orElse('python3').get(),
    generator.absolutePath, '--kind', 'android', '--out', brandOutput.absolutePath
}
tasks.matching { it.name == 'preBuild' ||
  (it.name.startsWith('merge') && it.name.endsWith('Resources')) }.configureEach {
  dependsOn generateBranding
}

android {
  namespace 'me.hirameki.kotonoha.android'
  compileSdk 36
  ndkVersion '30.0.16248370'

  defaultConfig {
    minSdk 28
    targetSdk 34
    versionCode 1
    versionName '0.1.0'

    ndk {
      abiFilters.addAll(abis)
    }

    externalNativeBuild {
      cmake {
        arguments "-DCMAKE_TOOLCHAIN_FILE=${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
          "-DVCPKG_MANIFEST_DIR=${engineRoot}",
          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
          "-DKOTONOHA_SDL_SOURCE_DIR=${sdlRoot}",
          // Android requires SDL's Java bindings and matching native sources.
          // Keep SDL3, SDL3_ttf and ImGui from their checked-out submodules.
          '-DKOTONOHA_SDL_PROVIDER=SUBMODULES',
          '-DKOTONOHA_IMGUI_FROM_VCPKG=OFF',
          // Keep NDK and vcpkg ARMv7 builds on the same NEON target.
          '-DANDROID_ARM_NEON=ON',
          '-DANDROID_STL=c++_shared'
      }
    }
  }

  flavorDimensions += 'game'

  productFlavors {
    games.each { flavor, game ->
      create(flavor) {
        dimension 'game'
        if (flavor == 'schoolDays') minSdk 30
        buildConfigField 'boolean', 'HAS_DISCORD_RPC', (flavor == 'schoolDays' && discordAar != null).toString()
        applicationId game[2]
        manifestPlaceholders.appName = game[3]
        buildConfigField 'String', 'NATIVE_TARGET', "\"${game[1]}\""
        // Flavor identity is independent of the native target: NATIVE_TARGET is
        // now KotonohaLauncherCore for the launcher, but the Material UI still
        // needs to be selected instead of the SDL GameActivity.
        buildConfigField 'boolean', 'IS_LAUNCHER_FLAVOR',
          (flavor == 'launcher' ? 'true' : 'false')

        externalNativeBuild {
          cmake {
            // Must match the variable consumed by the root CMakeLists.txt.
            arguments "-DANDROID_PLATFORM=android-${flavor == 'schoolDays' ? 30 : 28}",
              "-DKOTONOHA_BUILD_GAME=${game[0]}",
              "-DKOTONOHA_VCPKG_BASE_DIR=${rootProject.projectDir}/build/vcpkg${flavor in ['dokiDoki', 'katawaShoujo', 'launcher'] ? '-python' : ''}"
            targets game[1]
            if (flavor == 'schoolDays') {
              arguments "-DKOTONOHA_SCHOOL_DAYS_DISPLAY_OVERLAY_SOURCE=${schoolDaysDisplayOverlaySource}",
                "-DKOTONOHA_SCHOOL_DAYS_REQUIRE_EMBEDDED_OVERLAY=${schoolDaysRequireEmbeddedOverlay ? 'ON' : 'OFF'}",
                "-DKOTONOHA_SCHOOL_DAYS_EMBED_PRIVATE_OPTION_ART=${schoolDaysEmbedPrivateOptionArt ? 'ON' : 'OFF'}"
            }
            if (flavor == 'schoolDays' && discordAar != null) {
              arguments '-DKOTONOHA_ANDROID_DISCORD_RPC=ON',
                "-DKOTONOHA_ANDROID_DISCORD_SDK_DIR=${discordNative.get().asFile.absolutePath}"
            } else {
              arguments '-DKOTONOHA_ANDROID_DISCORD_RPC=OFF'
            }
          }
        }
      }
    }
  }

  buildTypes {
    debug {
      buildConfigField 'boolean', 'IS_DISTRIBUTION_BUILD', 'false'
      externalNativeBuild {
        cmake {
          arguments '-DKOTONOHA_DISTRIBUTION_BUILD=OFF'
        }
      }
    }
    release {
      buildConfigField 'boolean', 'IS_DISTRIBUTION_BUILD', 'false'
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
        'proguard-rules.pro',
        file("${sdlRoot}/android-project/app/proguard-rules.pro")
    }
    dist {
      initWith release
      // Player-facing distribution build (test-signed for device QA; isolated
      // application ID so Android DEV and DIST coexist without state overlap).
      applicationIdSuffix '.dist'
      versionNameSuffix '-dist'
      debuggable false
      signingConfig signingConfigs.debug
      matchingFallbacks = ['release']
      buildConfigField 'boolean', 'IS_DISTRIBUTION_BUILD', 'true'
      externalNativeBuild {
        cmake {
          arguments '-DKOTONOHA_DISTRIBUTION_BUILD=ON',
            '-DKOTONOHA_DEV_CONTROL=OFF',
            '-DKOTONOHA_ENABLE_MCP=OFF',
            '-DKOTONOHA_ENABLE_PLAYER_DUBBING=OFF',
            '-DCMAKE_BUILD_TYPE=Release'
        }
      }
    }
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  externalNativeBuild {
    cmake {
      path '../../../CMakeLists.txt'
      version '3.22.1'
    }
  }

  sourceSets {
    schoolDays.java.srcDir new File(engineRoot, 'games/school-days/android/java')
    main {
      java.srcDirs += sdlJavaRoot
      // Adaptive icons and density fallbacks imported from design/generated/.
      res.srcDir new File(brandOutput, 'android/res')
    }
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
      // Both the AAR and the CMake imported target refer to the same SDK SO.
      if (discordAar != null) pickFirsts += ['**/libdiscord_partner_sdk.so']
    }
  }
}

dependencies {
  implementation 'com.google.android.material:material:1.14.0'
  implementation 'androidx.appcompat:appcompat:1.8.0'
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
  implementation 'androidx.documentfile:documentfile:1.1.0'
  implementation 'androidx.activity:activity:1.13.0'
}

// ------------------------------------------------------------
// Generate Android launcher icons from the Windows SchoolDays.ico
// ------------------------------------------------------------

if (discordAar != null) {
  dependencies {
    schoolDaysImplementation files(discordAar)
  }
  // The vendor AAR carries both the Java runtime and the ABI-specific native
  // module. Extract only its Prefab module for CMake; no extra Prefab CLI.
  def prepareDiscord = tasks.register('prepareDiscordPresenceSdk', Sync) {
    from(zipTree(discordAar)) {
      include 'prefab/modules/discord_partner_sdk/**'
    }
    into discordNative
  }
  tasks.configureEach {
    if (name.startsWith('configureCMake') || name.startsWith('buildCMake')) {
      dependsOn prepareDiscord
    }
  }
}

def schoolDaysIconSource = new File(engineRoot, 'assets/SchoolDays.ico')
def schoolDaysIconsOut = layout.buildDirectory.dir('generated/res/schoolDaysIcons')

def generateSchoolDaysLauncherIcons = tasks.register('generateSchoolDaysLauncherIcons') {
  inputs.file(schoolDaysIconSource)
  outputs.dir(schoolDaysIconsOut)

  doLast {
    if (!schoolDaysIconSource.isFile()) {
      throw new GradleException("Missing Windows icon source: ${schoolDaysIconSource}")
    }
    byte[] icoBytes = schoolDaysIconSource.bytes
    ByteBuffer hdr = ByteBuffer.wrap(icoBytes).order(ByteOrder.LITTLE_ENDIAN)
    int count = hdr.getShort(4) & 0xFFFF
    int bestDim = -1
    int bestOff = 0
    int bestLen = 0
    for (int i = 0; i < count; i++) {
      int pos = 6 + i * 16
      int w = icoBytes[pos] & 0xFF
      if (w == 0) w = 256
      int len = hdr.getInt(pos + 8)
      int off = hdr.getInt(pos + 12)
      boolean isPng = off + 4 <= icoBytes.length &&
        (icoBytes[off] & 0xFF) == 0x89 &&
        icoBytes[off + 1] == (byte) 'P' &&
        icoBytes[off + 2] == (byte) 'N' &&
        icoBytes[off + 3] == (byte) 'G'
      if (isPng && w > bestDim) {
        bestDim = w
        bestOff = off
        bestLen = len
      }
    }
    if (bestDim <= 0) {
      throw new GradleException("No PNG entry found in ${schoolDaysIconSource}")
    }
    BufferedImage src = ImageIO.read(new ByteArrayInputStream(icoBytes, bestOff, bestLen))
    if (src == null) {
      throw new GradleException("Failed to decode PNG from ${schoolDaysIconSource}")
    }

    File resRoot = schoolDaysIconsOut.get().asFile
    resRoot.mkdirs()

    File valuesDir = new File(resRoot, 'values')
    valuesDir.mkdirs()
    new File(valuesDir, 'ic_launcher_background.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#FFFFFF</color>
</resources>
'''

    File anydpiDir = new File(resRoot, 'mipmap-anydpi-v26')
    anydpiDir.mkdirs()
    String adaptiveXml = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background" />
    <foreground android:drawable="@mipmap/ic_launcher_foreground" />
</adaptive-icon>
'''
    new File(anydpiDir, 'ic_launcher.xml').text = adaptiveXml
    new File(anydpiDir, 'ic_launcher_round.xml').text = adaptiveXml

    def densities = [mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192]
    densities.each { density, size ->
      File dir = new File(resRoot, "mipmap-${density}")
      dir.mkdirs()

      // Standard square icon (white canvas + tiny safe margin)
      BufferedImage sq = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
      Graphics2D g = sq.createGraphics()
      g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
      g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
      g.setColor(Color.WHITE)
      g.fillRect(0, 0, size, size)
      int pad = Math.max(1, (int) Math.round(size * 0.04))
      g.drawImage(src, pad, pad, size - pad * 2, size - pad * 2, null)
      g.dispose()
      ImageIO.write(sq, 'PNG', new File(dir, 'ic_launcher.png'))

      // Round icon (circular mask, inset so silhouette never clips)
      BufferedImage rnd = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
      Graphics2D gr = rnd.createGraphics()
      gr.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
      gr.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
      gr.setClip(new Ellipse2D.Double(0, 0, size, size))
      gr.setColor(Color.WHITE)
      gr.fillRect(0, 0, size, size)
      int rPad = Math.max(2, (int) Math.round(size * 0.10))
      gr.drawImage(src, rPad, rPad, size - rPad * 2, size - rPad * 2, null)
      gr.dispose()
      ImageIO.write(rnd, 'PNG', new File(dir, 'ic_launcher_round.png'))

      // Adaptive foreground (108dp canvas; artwork centered in 66dp safe zone)
      int fgSize = (size * 9) / 4
      BufferedImage fg = new BufferedImage(fgSize, fgSize, BufferedImage.TYPE_INT_ARGB)
      Graphics2D gf = fg.createGraphics()
      gf.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
      gf.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
      gf.setComposite(AlphaComposite.Clear)
      gf.fillRect(0, 0, fgSize, fgSize)
      gf.setComposite(AlphaComposite.SrcOver)
      int inner = (int) Math.round(fgSize * 0.64)
      int offset = (fgSize - inner) / 2
      gf.drawImage(src, offset, offset, inner, inner, null)
      gf.dispose()
      ImageIO.write(fg, 'PNG', new File(dir, 'ic_launcher_foreground.png'))
    }
  }
}

// ------------------------------------------------------------
// Stage game assets and produce a SHA-256 manifest
// ------------------------------------------------------------

android.applicationVariants.all { variant ->
  if (variant.flavorName == 'schoolDays') {
    variant.registerGeneratedResFolders(
      project.files(schoolDaysIconsOut).builtBy(generateSchoolDaysLauncherIcons))
  }
  def game = games[variant.flavorName]
  def taskSuffix = variant.name.capitalize()
  def staged = layout.buildDirectory.dir("generated/assets/${variant.name}")
  def isLauncher = variant.flavorName == 'launcher'
  def gameAssets = new File(engineRoot, "games/${game[0]}/game-assets")
  def schoolDaysRoute = new File(engineRoot,
    'games/school-days/game-assets/school-days-hq.ktnroute')
  // Original School Days packs are always loaded externally via SAF.
  // Other games may include assets only when explicitly allowed for private QA;
  // no dist build may carry retail GPKs or proprietary game data.
  def includeThisGame = !isLauncher && variant.flavorName != 'schoolDays' &&
    (variant.flavorName == 'example' ||
     (includeGameAssets && variant.buildType.name != 'dist'))
  def schoolDaysLauncherArt = new File(engineRoot,
    'games/school-days/game-assets/launcher-art/SchoolDaysHQ-Launcher.png')
  def stageSchoolDaysLauncherArt = variant.flavorName == 'schoolDays' &&
    project.findProperty('includeLauncherArt')?.toString() != 'false' &&
    schoolDaysLauncherArt.isFile()

  def assets = tasks.register("stage${taskSuffix}Assets", Sync) {
    dependsOn generateBranding
    from(new File(engineRoot, 'assets')) {
      if (variant.flavorName == 'schoolDays') {
        // Preserve the fork's authorized School Days splash / art; keep
        // common fonts available for subtitles and presentation.
        include 'Anime4K/*.glsl', 'Anime4K/*.txt',
          'ArtCNN/*.glsl', 'ArtCNN/*.txt', 'SPLASH.PNG', 'fonts/**'
      } else {
        exclude 'SPLASH.PNG' // Other games use the universal generated brand.
      }
      into 'assets'
    }
    // Do not override School Days' fork-specific SPLASH.PNG with the
    // upstream universal-brand splash. All other games use upstream branding.
    if (variant.flavorName != 'schoolDays') {
      from(new File(brandOutput, 'splash/SPLASH.PNG')) {
        into 'assets'
      }
    }
    // Keep license and attribution notices with every distributable APK.
    from(new File(engineRoot, 'LICENSE')) {
      into 'licenses'
    }
    from(new File(engineRoot, 'THIRD_PARTY_NOTICES.md')) {
      into 'licenses'
    }
    from(new File(engineRoot, 'modules/providers/amagami/third_party/open-amagami-LICENSE.txt')) {
      into 'licenses/third-party'
    }
    from(new File(engineRoot, 'games/reallive/vendor/libreallive/LICENSE')) {
      into 'licenses/third-party'
    }

    if (stageSchoolDaysLauncherArt) {
      from(schoolDaysLauncherArt) {
        into 'assets'
      }
    }

    if (variant.flavorName == 'schoolDays' && discordAar != null) {
      from(new File(discordSdkRoot, 'License-Notices.txt')) {
        into 'assets/licenses/discord'
      }
    }

    if (includeThisGame) {
      from(gameAssets) {
        into 'game-assets'
      }
    } else if (isLauncher && schoolDaysRoute.isFile()) {
      from(schoolDaysRoute) {
        into 'game-assets'
      }
    }

    into staged

    doFirst {
      if (includeThisGame && !gameAssets.isDirectory()) {
        throw new GradleException("Game asset source directory is missing: ${gameAssets}")
      }
    }

    doLast {
      def stagedDir = staged.get().asFile
      new File(stagedDir, 'game-assets').mkdirs()

      if (variant.flavorName in ['dokiDoki', 'katawaShoujo', 'launcher']) {
        def foundStdlib = false

        abis.each { abi ->
          def triplet = [
            'arm64-v8a': 'arm64-android',
            'x86_64'   : 'x64-android',
            'x86'      : 'x86-android',
            'armeabi-v7a': 'arm-neon-android'
          ][abi]

          if (!foundStdlib && triplet != null) {
            def prefix = new File(rootProject.projectDir,
              "build/vcpkg-python/${abi}/${triplet}")
            def libraryRoot = new File(prefix,
              variant.buildType.name == 'debug' ? 'debug/lib' : 'lib')
            def stdlibs = fileTree(libraryRoot).matching {
              include 'python3.*/**'
              exclude 'python3.*/lib-dynload/**'
              exclude '**/__pycache__/**'
            }.files

            if (!stdlibs.empty) {
              foundStdlib = true
              copy {
                from libraryRoot
                include 'python3.*/**'
                exclude 'python3.*/lib-dynload/**'
                exclude '**/__pycache__/**'
                into new File(stagedDir, 'python/lib')
              }
            }
          }
        }

        if (!foundStdlib) {
          throw new GradleException(
            'Android CPython standard library is missing for the selected ABIs.')
        }
      }

      def digest = MessageDigest.getInstance('SHA-256')
      fileTree(stagedDir).files
        .findAll { it.isFile() && it.name != 'packaged-assets.sha256' }
        .sort { it.path }
        .each { assetFile ->
          def relativePath = stagedDir.toPath().relativize(assetFile.toPath())
            .toString().replace('\\', '/')
          digest.update(relativePath.getBytes('UTF-8'))
          assetFile.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = stream.read(buffer)) != -1) {
              digest.update(buffer, 0, count)
            }
          }
        }

      new File(stagedDir, 'packaged-assets.sha256').text =
        digest.digest().encodeHex().toString() + '\n'
    }
  }

  variant.mergeAssetsProvider.configure {
    dependsOn assets
    inputs.dir staged
  }
  tasks.matching {
    it.name == "generate${taskSuffix}LintVitalReportModel" ||
    it.name == "lintVitalAnalyze${taskSuffix}"
  }.configureEach {
    dependsOn assets
  }
  android.sourceSets[variant.name].assets.srcDir staged

  if (variant.flavorName in ['dokiDoki', 'katawaShoujo', 'launcher']) {
    assets.configure {
      dependsOn variant.externalNativeBuildProviders
    }

    // Android 10+ (API 29+, targetSdk >= 29) blocks dlopen() from getFilesDir().
    // Package each ABI's CPython lib-dynload/*.so inside jniLibs/<abi>/ renamed
    // to libpyext_<module>.so so Android PackageManager extracts them into
    // ApplicationInfo.nativeLibraryDir with executable permissions.
    def stagedJniLibs = layout.buildDirectory.dir("generated/jniLibs/${variant.name}")
    def pythonExtensions = tasks.register("stage${taskSuffix}PythonExtensions") {
      dependsOn variant.externalNativeBuildProviders
      outputs.dir stagedJniLibs

      doLast {
        def outRoot = stagedJniLibs.get().asFile
        delete outRoot
        def foundAny = false

        abis.each { abi ->
          def triplet = [
            'arm64-v8a'  : 'arm64-android',
            'x86_64'     : 'x64-android',
            'x86'        : 'x86-android',
            'armeabi-v7a': 'arm-neon-android'
          ][abi]

          if (triplet != null) {
            def prefix = new File(rootProject.projectDir,
              "build/vcpkg-python/${abi}/${triplet}")
            def libraryRoot = new File(prefix,
              variant.buildType.name == 'debug' ? 'debug/lib' : 'lib')
            def dynloadFiles = fileTree(libraryRoot).matching {
              include 'python3.*/lib-dynload/*.so'
            }.files

            if (!dynloadFiles.empty) {
              foundAny = true
              def abiDir = new File(outRoot, abi)
              abiDir.mkdirs()
              dynloadFiles.each { extFile ->
                def moduleName = extFile.name.replaceFirst(/\.cpython-.*\.so$/, '')
                  .replaceFirst(/\.so$/, '')
                copy {
                  from extFile
                  into abiDir
                  rename { "libpyext_${moduleName}.so" }
                }
              }
            }
          }
        }

        if (!foundAny) {
          throw new GradleException(
            'Android CPython lib-dynload extensions are missing for the selected ABIs.')
        }
      }
    }

    android.sourceSets[variant.name].jniLibs.srcDir stagedJniLibs.get().asFile
    tasks.named("merge${taskSuffix}JniLibFolders").configure {
      dependsOn pythonExtensions
      inputs.dir stagedJniLibs
    }
  }
}
