name: RealLive BGM fades and gain normalization

on:
  push:
    branches: [dev]
    paths:
      - 'games/reallive/src/RealLiveAudioFade.hpp'
      - 'games/reallive/src/RealLiveAudioWait.hpp'
      - 'games/reallive/src/RealLiveChannelLevels.hpp'
      - 'games/reallive/tests/ChannelLevelsTest.cpp'
      - 'games/reallive/tests/AudioWaitTest.cpp'
      - 'games/reallive/src/RealLiveRuntime.cpp'
      - 'games/reallive/tests/AudioFadeTest.cpp'
      - 'games/reallive/CMakeLists.txt'
      - '.github/workflows/reallive-audio-regressions.yml'
  pull_request:
    paths:
      - 'games/reallive/src/RealLiveAudioFade.hpp'
      - 'games/reallive/src/RealLiveAudioWait.hpp'
      - 'games/reallive/src/RealLiveChannelLevels.hpp'
      - 'games/reallive/tests/ChannelLevelsTest.cpp'
      - 'games/reallive/tests/AudioWaitTest.cpp'
      - 'games/reallive/src/RealLiveRuntime.cpp'
      - 'games/reallive/tests/AudioFadeTest.cpp'
      - 'games/reallive/CMakeLists.txt'
      - '.github/workflows/reallive-audio-regressions.yml'
  workflow_dispatch:

jobs:
  audio-gain:
    name: RealLive PCM gain and fades (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++17 BGM regression
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Igames/reallive/src games/reallive/tests/AudioFadeTest.cpp \
            -o /tmp/reallive-audio-fade-test
      - name: Compile C++17 cooperative audio-wait regression
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Igames/reallive/src games/reallive/tests/AudioWaitTest.cpp \
            -o /tmp/reallive-audio-wait-test
      - name: Run voice and PCM wait fixtures
        run: /tmp/reallive-audio-wait-test
      - name: Compile C++17 script PCM/voice channel volume regression
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Igames/reallive/src games/reallive/tests/ChannelLevelsTest.cpp \
            -o /tmp/reallive-channel-levels-test
      - name: Test fades and independent PCM channel levels
        run: /tmp/reallive-channel-levels-test
      - name: Run volume and fade fixtures
        run: /tmp/reallive-audio-fade-test
