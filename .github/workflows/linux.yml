name: Linux and WASM vcpkg artifacts (one runner)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-wasm-vcpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-wasm:
    name: Build Linux x64 and WASM on one Ubuntu runner
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux and browser build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake pkg-config patchelf zip unzip curl autoconf autoconf-archive automake libtool libltdl-dev nasm yasm bison flex libssl-dev libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev libxft-dev libwayland-dev libegl1-mesa-dev libfreetype-dev python3 ffmpeg

      - name: Verify autotools required by vcpkg gperf
        run: |
          for program in autoconf automake aclocal libtoolize; do
            command -v "$program" >/dev/null || { echo "::error::Missing $program"; exit 1; }
          done
          dpkg-query -W autoconf-archive

      - name: Set up pinned vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Restore Linux vcpkg binary dependency archives
        id: linux-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache/linux
          key: kotonoha-deps-v3-linux-x64-linux-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

      - name: Precompile Linux vcpkg dependencies on cache miss
        if: steps.linux-deps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vcpkg-binary-cache/linux
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache/linux,readwrite"
          "$VCPKG_ROOT/vcpkg" install --triplet=x64-linux-dynamic --x-feature=sdl-vcpkg \
            "--overlay-ports=$GITHUB_WORKSPACE/vcpkg-overlays/ports"

      - name: Save Linux vcpkg dependency archives
        if: steps.linux-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache/linux
          key: kotonoha-deps-v3-linux-x64-linux-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

      - name: Run source audits
        run: |
          python3 tools/ValidateBuildMetadata.py
          python3 tools/check_sdl_cpack.py
          python3 tools/audit_filesystem_v2.py --strict
          python3 tools/check_game_platform_isolation.py
      - name: Configure with vcpkg
        run: |
          mkdir -p vcpkg-binary-cache/linux
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache/linux,readwrite"
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg" \
            -DKOTONOHA_SDL_PROVIDER=VCPKG \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/vcpkg-overlays/ports" \
            -DKOTONOHA_BUILD_ALL=ON -DBUILD_TESTING=ON
      - name: Compile all game ports
        run: cmake --build build-linux --parallel 3
      - name: Create ZIP packages
        run: cpack --config build-linux/CPackConfig.cmake -G ZIP
      - name: Verify ZIP packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          packages = sorted(Path("build-linux/packages").glob("*.zip"))
          import json
          expected = len(json.loads(
              Path("buildsystems/xcode/ProjectManifest.json").read_text(
                  encoding="utf-8"))["games"])
          assert len(packages) >= expected, (
              f"Expected at least {expected} game packages, got {len(packages)}"
          )
          for archive in packages:
              with ZipFile(archive) as package:
                  assert package.namelist(), f"Empty archive: {archive}"
          print(f"Validated {len(packages)} Linux game ZIPs")
          PY

      - name: Upload linux standalone build outputs
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-outputs
          path: build-linux/outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kotonoha CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-Kotonoha
          path: build-linux/packages/*-Kotonoha.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Amagami CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-Amagami
          path: build-linux/packages/*-Amagami.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZeroNoTsukaima CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-ZeroNoTsukaima
          path: build-linux/packages/*-ZeroNoTsukaima.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SnowRadish CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-SnowRadish
          path: build-linux/packages/*-SnowRadish.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SummerRadish CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-SummerRadish
          path: build-linux/packages/*-SummerRadish.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload MEO CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-MEO
          path: build-linux/packages/*-MEO.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DokiDoki CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-DokiDoki
          path: build-linux/packages/*-DokiDoki.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload KatawaShoujo CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-KatawaShoujo
          path: build-linux/packages/*-KatawaShoujo.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SchoolDays CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-SchoolDays
          path: build-linux/packages/*-SchoolDays.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload RealLive CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-RealLive
          path: build-linux/packages/*-RealLive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kirikiri CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-Kirikiri
          path: build-linux/packages/*-Kirikiri.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload LucaSystem CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-LucaSystem
          path: build-linux/packages/*-LucaSystem.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pmail CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-Pmail
          path: build-linux/packages/*-Pmail.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload PonscripterGame CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-PonscripterGame
          path: build-linux/packages/*-PonscripterGame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload N2SystemGame CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-N2SystemGame
          path: build-linux/packages/*-N2SystemGame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload KotonohaLauncher CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-KotonohaLauncher
          path: build-linux/packages/*-KotonohaLauncher.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run synthetic CTest suite (no retail assets)
        id: synthetic-ctest
        continue-on-error: true
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build-linux -L synthetic --output-on-failure --no-tests=error

      - name: Warn if synthetic CTest failed
        if: steps.synthetic-ctest.outcome == 'failure'
        run: |
          echo "::warning::Linux synthetic CTest failed; compiled ZIP artifacts remain available"
          echo "⚠️ Linux: synthetic CTest failed. See the step logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "3.1.73"
          actions-cache-folder: emsdk-cache

      - name: Restore WASM vcpkg binary dependency archives
        id: wasm-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache/wasm
          key: kotonoha-deps-v3-wasm-3.1.73-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

      - name: Precompile WASM vcpkg dependencies on cache miss
        if: steps.wasm-deps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vcpkg-binary-cache/wasm
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache/wasm,readwrite"
          "$VCPKG_ROOT/vcpkg" install --triplet=wasm32-emscripten --x-feature=sdl-vcpkg \
            "--overlay-ports=$GITHUB_WORKSPACE/vcpkg-overlays/ports"

      - name: Save WASM vcpkg dependency archives
        if: steps.wasm-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache/wasm
          key: kotonoha-deps-v3-wasm-3.1.73-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

      - name: Enforce game/engine Emscripten isolation
        run: python3 tools/check_game_platform_isolation.py

      - name: Configure Emscripten self-test
        run: |
          mkdir -p vcpkg-binary-cache/wasm
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache/wasm,readwrite"
          emcc -v
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg" \
            -DKOTONOHA_SDL_PROVIDER=VCPKG \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/vcpkg-overlays/ports" \
            -DKOTONOHA_WEB_SELFTEST=ON \
            -DKOTONOHA_BUILD_ALL=ON \
            -DSDLTTF_PLUTOSVG=OFF

      - name: Compile all enabled WASM game ports and self-test
        run: cmake --build build-web --target all --parallel 2
      - name: Package WASM browser outputs into ZIP
        run: |
          mkdir -p build-web/packages
          (cd build-web/outputs && zip -qr ../packages/Kotonoha-wasm32-emscripten.zip .)

      - name: Upload WASM game artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-wasm-vcpkg
          path: |
            build-web/outputs/
            build-web/packages/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Verify Asyncify exports for every generated WASM game
        run: |
          count=0
          # Only game entrypoints have a sibling .wasm with the same basename.
          # Helper scripts (service-worker.js, KotonohaPreloadCache.js, ...)
          # are not Asyncify entrypoints and must not be passed to the checker.
          while IFS= read -r -d '' dir; do
            name=$(basename "$dir")
            js="$dir/$name.js"
            if [ -f "$js" ] && [ -f "$dir/$name.wasm" ]; then
              python3 tools/check_wasm_asyncify.py "$js"
              count=$((count + 1))
            fi
          done < <(find build-web/outputs -mindepth 1 -maxdepth 1 -type d -print0)
          test "$count" -ge 10
          echo "[Kotonoha] verified $count browser entrypoints"

      - name: Install Playwright Chromium and WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Run synthetic browser toolbar tests (Chromium and WebKit)
        id: synthetic-toolbar
        continue-on-error: true
        run: node tools/web_toolbar_layout.js build-web/outputs/KotonohaWebSelfTest

      - name: Run synthetic WASM Chromium regression tests
        id: synthetic-web
        continue-on-error: true
        run: node tools/web_selftest.js build-web/outputs/KotonohaWebSelfTest

      - name: Run synthetic example browser mouse and touch smoke test
        id: synthetic-example
        continue-on-error: true
        run: node tools/web_example_smoke.js build-web/outputs/Kotonoha

      - name: Verify output HTML, JavaScript and WebAssembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build-web/outputs")
          game_js = sorted(root.glob("*/*.js"))
          assert len(game_js) >= 10, f"Expected at least 10 WASM game entrypoints, found {len(game_js)}"
          for js in game_js:
              assert (js.parent / "index.html").is_file(), f"Missing HTML for {js}"
              assert js.with_suffix(".wasm").is_file(), f"Missing WASM for {js}"
          print(f"Validated {len(game_js)} WASM entrypoints")
          PY

      - name: Run synthetic HTTP Range server unit tests
        id: synthetic-http
        continue-on-error: true
        run: python3 -m unittest discover -s tools -p test_serve_web.py -v

      - name: Report synthetic browser and HTTP test failures
        if: ${{ always() && (steps.synthetic-toolbar.outcome == 'failure' || steps.synthetic-web.outcome == 'failure' || steps.synthetic-example.outcome == 'failure' || steps.synthetic-http.outcome == 'failure') }}
        run: |
          echo "::warning::One or more WASM synthetic tests failed; build and ZIP artifacts were published"
          echo "⚠️ WASM: synthetic browser/HTTP tests failed. Check the failed test steps." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-diagnostics
          path: |
            build-web/CMakeFiles/CMakeConfigureLog.yaml
            build-web/CMakeFiles/CMakeError.log
            build-web/outputs/KotonohaWebSelfTest/index.html
          if-no-files-found: ignore

# A single runner compiles Linux and WebAssembly; dependency archives are cached,
# but no incremental CMake or Gradle build directories are restored or saved.
