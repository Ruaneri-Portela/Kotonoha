name: Linux x64 dynamic vcpkg artifacts

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: linux-vcpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vcpkg-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore prebuilt dependency archives
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-linux-x64-linux-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}
          restore-keys: |
            kotonoha-deps-v2-linux-x64-linux-dynamic-
      - name: Install build prerequisites
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake pkg-config patchelf zip unzip curl autoconf autoconf-archive automake libtool libltdl-dev nasm yasm bison flex libssl-dev libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev libxft-dev libwayland-dev libegl1-mesa-dev libfreetype-dev
      - name: Verify autotools required by vcpkg gperf
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          for program in autoconf automake aclocal libtoolize; do
            command -v "$program" >/dev/null || { echo "::error::Missing $program"; exit 1; }
          done
          dpkg-query -W autoconf-archive

      - name: Set up pinned vcpkg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Precompile Linux vcpkg packages
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          "$VCPKG_ROOT/vcpkg" install --triplet=x64-linux-dynamic --x-feature=sdl-vcpkg --x-feature=imgui-vcpkg \
            "--overlay-ports=$GITHUB_WORKSPACE/vcpkg-overlays/ports"
      - name: Save finished vcpkg dependency archives
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-linux-x64-linux-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

  linux:
    needs: vcpkg-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake pkg-config patchelf zip unzip curl autoconf autoconf-archive automake libtool libltdl-dev nasm yasm bison flex libssl-dev libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev libxkbcommon-dev libxft-dev libwayland-dev libegl1-mesa-dev libfreetype-dev
      - name: Verify autotools required by vcpkg gperf
        run: |
          for program in autoconf automake aclocal libtoolize; do
            command -v "$program" >/dev/null || { echo "::error::Missing $program"; exit 1; }
          done
          dpkg-query -W autoconf-archive

      - name: Set up pinned vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Restore vcpkg archives built in the dependency job
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-linux-x64-linux-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}
          fail-on-cache-miss: true

      - name: Restore incremental Linux x64 build directories
        id: build-tree-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-linux/**
            !build-linux/vcpkg_installed/**
            !build-linux/packages/**
          key: kotonoha-build-v1-linux-x64-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**', 'CMakeLists.txt', 'buildsystems/cmake/**') }}-${{ github.sha }}
          restore-keys: |
            kotonoha-build-v1-linux-x64-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**', 'CMakeLists.txt', 'buildsystems/cmake/**') }}-

      - name: Run source audits
        run: |
          python3 tools/ValidateBuildMetadata.py
          python3 tools/check_sdl_cpack.py
          python3 tools/audit_filesystem_v2.py --strict
          python3 tools/check_game_platform_isolation.py
      - name: Configure with vcpkg
        run: |
          mkdir -p vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg;imgui-vcpkg" \
            -DKOTONOHA_SDL_FROM_VCPKG=ON -DKOTONOHA_IMGUI_FROM_VCPKG=ON \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/vcpkg-overlays/ports" \
            -DKOTONOHA_BUILD_ALL=ON -DBUILD_TESTING=ON
      - name: Compile all game ports
        run: cmake --build build-linux --parallel 3
      - name: Save compiled Linux x64 build directories
        if: steps.build-tree-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-linux/**
            !build-linux/vcpkg_installed/**
            !build-linux/packages/**
          key: kotonoha-build-v1-linux-x64-dynamic-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**', 'CMakeLists.txt', 'buildsystems/cmake/**') }}-${{ github.sha }}

      - name: Create ZIP packages
        run: cpack --config build-linux/CPackConfig.cmake -G ZIP
      - name: Verify ZIP packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          packages = sorted(Path("build-linux/packages").glob("*.zip"))
          assert len(packages) >= 11, f"Expected 11 game packages, got {len(packages)}"
          for archive in packages:
              with ZipFile(archive) as package:
                  assert package.namelist(), f"Empty archive: {archive}"
          print(f"Validated {len(packages)} Linux game ZIPs")
          PY

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-linux-x64-dynamic-vcpkg
          path: |
            build-linux/outputs/
            build-linux/packages/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run synthetic CTest suite (no retail assets)
        id: synthetic-ctest
        continue-on-error: true
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build-linux -L synthetic --output-on-failure --no-tests=error

      - name: Warn if synthetic CTest failed
        if: steps.synthetic-ctest.outcome == 'failure'
        run: |
          echo "::warning::Linux synthetic CTest failed; compiled ZIP artifacts remain available"
          echo "⚠️ Linux: synthetic CTest failed. See the step logs." >> "$GITHUB_STEP_SUMMARY"

