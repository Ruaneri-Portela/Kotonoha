name: Discord desktop IPC regressions

on:
  push:
    branches: [main, dev]
    paths:
      - "buildsystems/xcode/Kotonoha.xcodeproj/project.pbxproj"
      - "tools/check_xcode_presence.py"
      - "lib/src/integrations/**"
      - "lib/include/Kotonoha/integrations/**"
      - "lib/tests/RichPresenceTest.cpp"
      - "lib/tests/DiscordUnixTest.cpp"
      - ".github/workflows/discord-presence.yml"
  pull_request:
    paths:
      - "buildsystems/xcode/Kotonoha.xcodeproj/project.pbxproj"
      - "tools/check_xcode_presence.py"
      - "lib/src/integrations/**"
      - "lib/include/Kotonoha/integrations/**"
      - "lib/tests/RichPresenceTest.cpp"
      - "lib/tests/DiscordUnixTest.cpp"
      - ".github/workflows/discord-presence.yml"

jobs:
  desktop-ipc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode RPC transport ownership
        run: python3 tools/check_xcode_presence.py
      - name: Install json-c
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install json-c pkgconf
          else
            sudo apt-get update
            sudo apt-get install -y libjson-c-dev pkg-config
          fi
      - name: Compile and run synthetic IPC tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -Ilib/include \
            lib/src/integrations/RichPresence.cpp lib/tests/RichPresenceTest.cpp \
            -o /tmp/kotonoha-presence-test
          /tmp/kotonoha-presence-test
          # GCC's include_next requires the default /usr/include search
          # order. Only Homebrew's third-party headers need -isystem.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            json_c_flags=(-isystem "$(pkg-config --variable=includedir json-c)")
          else
            read -r -a json_c_flags <<< "$(pkg-config --cflags json-c)"
          fi
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -Ilib/include \
            "${json_c_flags[@]}" lib/src/integrations/DiscordUnix.cpp \
            lib/tests/DiscordUnixTest.cpp $(pkg-config --libs json-c) \
            -o /tmp/kotonoha-ipc-test
          /tmp/kotonoha-ipc-test
      - name: Check native CMake transport ON and OFF
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/rpc-cmake"
          mkdir -p "$fixture"
          cat > "$fixture/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(KotonohaRpcTests LANGUAGES CXX)
          include(CTest)
          add_subdirectory("$ENV{GITHUB_WORKSPACE}/lib/src/integrations" rpc)
          CMAKE
          for setting in ON OFF; do
            cmake -S "$fixture" -B "$fixture/$setting" \
              -DKOTONOHA_BUILD_RICH_PRESENCE="$setting" -DBUILD_TESTING=ON
            cmake --build "$fixture/$setting" --parallel 2
            ctest --test-dir "$fixture/$setting" -L synthetic --output-on-failure --no-tests=error
          done
    timeout-minutes: 10
