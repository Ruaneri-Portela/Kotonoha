name: WebAssembly dynamic engine linkage

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/wasm-shared-engine.yml"
      - "buildsystems/cmake/KotonohaApp.cmake"
      - "buildsystems/cmake/KotonohaOptions.cmake"
      - "buildsystems/cmake/index.html.in"
      - "lib/CMakeLists.txt"
      - "lib/src/core/WebMainExports.cpp"
      - "lib/src/core/WebAssetFetch.cpp"
      - "lib/web/KotonohaSharedWasmCache.js"
      - "tools/check_wasm_shared_layout.py"
      - "tools/check_wasm_asyncify.py"
      - "tools/generate_wasm_side_asyncify_imports.py"
      - "tools/test_wasm_shared_engine.py"

permissions:
  contents: read

jobs:
  dynamic-link-smoke:
    name: Compile and link real Emscripten main and side modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "latest"
      - name: Compile shared WASM and link game through Emscripten
        shell: bash
        run: |
          set -euo pipefail
          em++ --version
          mkdir -p /tmp/kotonoha-wasm-smoke/outputs/{libs,Smoke}
          cat > /tmp/kotonoha-wasm-smoke/engine.cpp <<'CPP'
          #include <emscripten.h>
          extern "C" int KotonohaSharedMultiply(int x, int y) {
            // Ensure a side-module call can suspend and then return.
            emscripten_sleep(1);
            return x * y;
          }
          CPP
          cat > /tmp/kotonoha-wasm-smoke/game.cpp <<'CPP'
          #include <cstdio>
          extern "C" int KotonohaSharedMultiply(int, int);
          int main() {
            if (KotonohaSharedMultiply(6, 7) != 42)
              return 1;
            std::puts("Kotonoha dynamic WASM smoke succeeded");
            return 0;
          }
          CPP
          em++ -O2 -std=c++17 -fPIC -fexceptions \
            /tmp/kotonoha-wasm-smoke/engine.cpp \
            -sSIDE_MODULE=1 -sASYNCIFY=1 \
            -o /tmp/kotonoha-wasm-smoke/outputs/libs/libkotonoha-smoke.wasm

          python3 tools/generate_wasm_side_asyncify_imports.py \
            /tmp/kotonoha-wasm-smoke/outputs/libs/libkotonoha-smoke.wasm \
            /tmp/kotonoha-wasm-smoke/engine-asyncify-imports.json

          em++ -O2 -std=c++17 -fexceptions \
            /tmp/kotonoha-wasm-smoke/game.cpp \
            /tmp/kotonoha-wasm-smoke/outputs/libs/libkotonoha-smoke.wasm \
            -sMAIN_MODULE=2 -sASYNCIFY=1 \
            -sASYNCIFY_IMPORTS=@/tmp/kotonoha-wasm-smoke/engine-asyncify-imports.json \
            -sASYNCIFY_STACK_SIZE=262144 \
            -o /tmp/kotonoha-wasm-smoke/outputs/Smoke/Smoke.js

          python3 tools/check_wasm_asyncify.py \
            /tmp/kotonoha-wasm-smoke/outputs/Smoke/Smoke.js
          python3 tools/check_wasm_shared_layout.py \
            /tmp/kotonoha-wasm-smoke/outputs/Smoke/Smoke.js \
            /tmp/kotonoha-wasm-smoke/outputs/libs/libkotonoha-smoke.wasm

          # A symlink is used for the Node smoke runner only; the published
          # browser layout keeps a single original in outputs/libs/.
          ln -s ../libs/libkotonoha-smoke.wasm \
            /tmp/kotonoha-wasm-smoke/outputs/Smoke/libkotonoha-smoke.wasm
          (cd /tmp/kotonoha-wasm-smoke/outputs/Smoke && node Smoke.js)
