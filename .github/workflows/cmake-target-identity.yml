name: Canonical CMake targets

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'lib/**/CMakeLists.txt'
      - 'games/**/CMakeLists.txt'
      - 'modules/**/CMakeLists.txt'
      - 'buildsystems/cmake/**'
      - 'tools/check_cmake_target_identity.py'
      - 'tools/test_msvc_dependency_isolation.py'
      - '.github/workflows/cmake-target-identity.yml'
  push:
    branches: [main, dev]
    paths:
      - 'CMakeLists.txt'
      - 'lib/**/CMakeLists.txt'
      - 'games/**/CMakeLists.txt'
      - 'modules/**/CMakeLists.txt'
      - 'buildsystems/cmake/**'
      - 'tools/check_cmake_target_identity.py'
      - 'tools/test_msvc_dependency_isolation.py'
      - '.github/workflows/cmake-target-identity.yml'
  workflow_dispatch:

jobs:
  validate-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical CMake targets and dependency graph
        run: |
          python3 tools/check_cmake_target_identity.py --self-test
          python3 tools/test_msvc_dependency_isolation.py
