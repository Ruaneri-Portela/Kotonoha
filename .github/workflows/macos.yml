name: macOS x64 and arm64 vcpkg builds and regression tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-vcpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vcpkg-deps:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            triplet: x64-osx-dynamic
          - arch: arm64
            runner: macos-15
            triplet: arm64-osx-dynamic
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Restore prebuilt dependency archives
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-macos-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}
          restore-keys: |
            kotonoha-deps-v2-macos-${{ matrix.triplet }}-
      - name: Install build prerequisites
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          brew install cmake ninja pkg-config nasm yasm \
            autoconf autoconf-archive automake libtool

          # Homebrew installs GNU libtoolize as glibtoolize on macOS.
          # Expose only libtoolize: exposing GNU libtool itself would shadow
          # Apple's /usr/bin/libtool, which is required for Mach-O archives.
          tools_dir="$RUNNER_TEMP/kotonoha-gnu-tools"
          mkdir -p "$tools_dir"
          ln -s "$(brew --prefix libtool)/bin/glibtoolize" "$tools_dir/libtoolize"
          echo "$tools_dir" >> "$GITHUB_PATH"
          export PATH="$tools_dir:$PATH"

          for tool in autoconf automake aclocal libtoolize; do
            command -v "$tool" >/dev/null || {
              echo "::error::Missing macOS build tool: $tool"
              exit 1
            }
          done
          test -d "$(brew --prefix autoconf-archive)/share/aclocal"
          test -x "$(brew --prefix libtool)/bin/glibtoolize"

      - name: Set up pinned vcpkg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          # Dynamic macOS triplets are community triplets in this pinned vcpkg.
          triplet_file="$RUNNER_TEMP/vcpkg/triplets/community/${{ matrix.triplet }}.cmake"
          test -f "$triplet_file"
          grep -Eq '^[[:space:]]*set\(VCPKG_LIBRARY_LINKAGE[[:space:]]+dynamic\)' "$triplet_file"
      - name: Precompile macOS vcpkg packages
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          "$VCPKG_ROOT/vcpkg" install --triplet="${{ matrix.triplet }}" --x-feature=sdl-vcpkg \
            "--overlay-ports=$GITHUB_WORKSPACE/vcpkg-overlays/ports"
      - name: Save finished vcpkg dependency archives
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-macos-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

  macos:
    needs: vcpkg-deps
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            triplet: x64-osx-dynamic
            bundles: "ON"
          - arch: arm64
            runner: macos-15
            triplet: arm64-osx-dynamic
            bundles: "ON"
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install build prerequisites
        run: |
          brew install cmake ninja pkg-config nasm yasm \
            autoconf autoconf-archive automake libtool

          # Homebrew installs GNU libtoolize as glibtoolize on macOS.
          # Expose only libtoolize: exposing GNU libtool itself would shadow
          # Apple's /usr/bin/libtool, which is required for Mach-O archives.
          tools_dir="$RUNNER_TEMP/kotonoha-gnu-tools"
          mkdir -p "$tools_dir"
          ln -s "$(brew --prefix libtool)/bin/glibtoolize" "$tools_dir/libtoolize"
          echo "$tools_dir" >> "$GITHUB_PATH"
          export PATH="$tools_dir:$PATH"

          for tool in autoconf automake aclocal libtoolize; do
            command -v "$tool" >/dev/null || {
              echo "::error::Missing macOS build tool: $tool"
              exit 1
            }
          done
          test -d "$(brew --prefix autoconf-archive)/share/aclocal"
          test -x "$(brew --prefix libtool)/bin/glibtoolize"

      - name: Set up pinned vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          # Dynamic macOS triplets are community triplets in this pinned vcpkg.
          triplet_file="$RUNNER_TEMP/vcpkg/triplets/community/${{ matrix.triplet }}.cmake"
          test -f "$triplet_file"
          grep -Eq '^[[:space:]]*set\(VCPKG_LIBRARY_LINKAGE[[:space:]]+dynamic\)' "$triplet_file"

      - name: Restore vcpkg archives built in the dependency job
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-macos-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}
          fail-on-cache-miss: true


      - name: Audit engine/game platform isolation
        run: |
          python3 tools/check_game_platform_isolation.py
          python3 tools/ValidateBuildMetadata.py
          python3 tools/audit_filesystem_v2.py --strict

      - name: Prepare macOS icon from tracked Windows icon
        run: |
          # icon.icns is not tracked; derive it from the repository's tracked .ico.
          ICON_SRC=""
          for candidate in assets/icon.ico assets/SchoolDays.ico; do
            if [ -f "$candidate" ]; then ICON_SRC="$candidate"; break; fi
          done
          test -n "$ICON_SRC"
          mkdir -p "$RUNNER_TEMP/kotonoha.iconset"
          sips -s format png "$ICON_SRC" --out "$RUNNER_TEMP/kotonoha-icon.png"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$RUNNER_TEMP/kotonoha-icon.png" \
              --out "$RUNNER_TEMP/kotonoha.iconset/icon_${size}x${size}.png"
          done
          iconutil -c icns "$RUNNER_TEMP/kotonoha.iconset" -o assets/icon.icns
          test -s assets/icon.icns

      - name: Configure all native game ports
        run: |
          mkdir -p vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg" \
            -DKOTONOHA_SDL_PROVIDER=VCPKG \
             \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/vcpkg-overlays/ports" \
            -DKOTONOHA_BUILD_ALL=ON -DBUILD_TESTING=ON \
            -DKOTONOHA_BUILD_MACOS_BUNDLES=${{ matrix.bundles }} \
            -DKOTONOHA_BUNDLE_LOCAL_GAME_ASSETS=OFF

      - name: Build all native game ports and tests
        run: cmake --build build-macos --parallel 3
      - name: Package native games
        run: cpack --config build-macos/CPackConfig.cmake -G ZIP

      - name: Verify ZIP packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          packages = sorted(Path("build-macos/packages").glob("*.zip"))
          import json
          expected = len(json.loads(
              Path("buildsystems/xcode/ProjectManifest.json").read_text(
                  encoding="utf-8"))["games"])
          assert len(packages) >= expected, (
              f"Expected at least {expected} game packages, got {len(packages)}"
          )
          for archive in packages:
              with ZipFile(archive) as package:
                  names = package.namelist()
                  assert names, f"Empty package: {archive}"
                  assert any(".app/Contents/MacOS/" in n for n in names), f"Missing .app executable: {archive}"
          print(f"Validated {len(packages)} macOS game ZIPs")
          PY

      - name: Upload macos standalone build outputs
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-outputs
          path: build-macos/outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kotonoha CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-Kotonoha
          path: build-macos/packages/*-Kotonoha.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Amagami CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-Amagami
          path: build-macos/packages/*-Amagami.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZeroNoTsukaima CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-ZeroNoTsukaima
          path: build-macos/packages/*-ZeroNoTsukaima.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SnowRadish CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-SnowRadish
          path: build-macos/packages/*-SnowRadish.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SummerRadish CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-SummerRadish
          path: build-macos/packages/*-SummerRadish.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload MEO CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-MEO
          path: build-macos/packages/*-MEO.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DokiDoki CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-DokiDoki
          path: build-macos/packages/*-DokiDoki.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload KatawaShoujo CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-KatawaShoujo
          path: build-macos/packages/*-KatawaShoujo.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SchoolDays CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-SchoolDays
          path: build-macos/packages/*-SchoolDays.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload RealLive CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-RealLive
          path: build-macos/packages/*-RealLive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kirikiri CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-Kirikiri
          path: build-macos/packages/*-Kirikiri.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload LucaSystem CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-LucaSystem
          path: build-macos/packages/*-LucaSystem.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pmail CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-Pmail
          path: build-macos/packages/*-Pmail.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload PonscripterGame CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-PonscripterGame
          path: build-macos/packages/*-PonscripterGame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload N2SystemGame CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-N2SystemGame
          path: build-macos/packages/*-N2SystemGame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload KotonohaLauncher CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-macos-${{ matrix.triplet }}-KotonohaLauncher
          path: build-macos/packages/*-KotonohaLauncher.zip
          if-no-files-found: error
          retention-days: 14

      - name: Verify SchoolDays executable architecture and macOS bundle
        run: |
          if [ "${{ matrix.bundles }}" = "ON" ]; then
            executable="build-macos/outputs/SchoolDays.app/Contents/MacOS/SchoolDays"
            test -d "build-macos/outputs/SchoolDays.app/Contents/Frameworks"
            codesign --verify --deep --strict --verbose=2 "build-macos/outputs/SchoolDays.app"
          else
            executable="build-macos/outputs/SchoolDays/SchoolDays"
          fi
          test -f "$executable"
          lipo "$executable" -verify_arch "${{ matrix.arch }}"
          test "$(lipo -archs "$executable")" = "${{ matrix.arch }}"

      - name: Run synthetic CTest suite (no retail assets)
        id: synthetic-ctest
        continue-on-error: true
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build-macos -L synthetic --output-on-failure --no-tests=error

      - name: Warn if synthetic CTest failed
        if: steps.synthetic-ctest.outcome == 'failure'
        run: |
          echo "::warning::macOS ${{ matrix.arch }} synthetic CTest failed; .app ZIP artifacts remain available"
          echo "⚠️ macOS ${{ matrix.arch }}: synthetic CTest failed. See the logs." >> "$GITHUB_STEP_SUMMARY"
