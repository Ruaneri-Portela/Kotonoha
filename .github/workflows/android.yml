name: Android arm64 Gradle and NDK smoke builds

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: android-vcpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'
          # Gradle is run from the verified distribution set up above, not
          # SDL's vendored Android wrapper. That upstream wrapper uses a
          # legacy JAR unknown to the Gradle validation list.
          validate-wrappers: false

      - uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Install host autotools for vcpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake libtool
          for program in autoconf automake aclocal libtoolize; do
            command -v "$program" >/dev/null || { echo "::error::Missing $program"; exit 1; }
          done
          dpkg-query -W autoconf-archive

      - name: Install pinned vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: buildsystems/android/build/vcpkg
          key: android-arm64-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/ports/**') }}
          restore-keys: android-arm64-vcpkg-

      - name: Verify Android SDL, SDL_ttf and ImGui submodules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("lib/submodules")
          sources = [
              root / "SDL/CMakeLists.txt",
              root / "SDL_ttf/CMakeLists.txt",
              root / "imgui/imgui.cpp",
              root / "imgui/backends/imgui_impl_sdl3.cpp",
              root / "imgui/backends/imgui_impl_sdlrenderer3.cpp",
              root / "SDL/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java",
              root / "SDL/android-project/app/src/main/java/org/libsdl/app/SDLSurface.java",
          ]
          for source in sources:
              assert source.is_file(), f"Missing Android SDL/submodule source: {source}"
          print("Verified native submodules and SDL Android Java integration")
          PY

      - name: Validate shared build metadata
        run: |
          python3 tools/ValidateBuildMetadata.py
          python3 tools/check_game_platform_isolation.py

      - name: Build Example and SchoolDays APKs (arm64-v8a)
        working-directory: buildsystems/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          gradle :app:assembleExampleDebug :app:assembleSchoolDaysDebug \
            -Pabis=arm64-v8a -PbundleGameAssets=false --no-daemon --stacktrace

      - name: Verify APK outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          caches = list(Path("buildsystems/android/app/.cxx").rglob("CMakeCache.txt"))
          assert caches, "No Android CMake cache generated"
          for cache in caches:
              settings = cache.read_text(encoding="utf-8")
              for option in ("KOTONOHA_SDL_FROM_VCPKG", "KOTONOHA_IMGUI_FROM_VCPKG"):
                  assert re.search(rf"^{option}:[^=]+=(OFF|FALSE|0)$", settings, re.M), (cache, option)
          for flavor in ("example", "schoolDays"):
              matches = list(Path("buildsystems/android/app/build/outputs/apk").rglob(f"*{flavor.lower()}*debug*.apk"))
              if not matches:
                  matches = list(Path("buildsystems/android/app/build/outputs/apk").rglob("*.apk"))
              assert any(flavor.lower() in p.name.lower() for p in matches), f"Missing {flavor} APK"
              for archive in matches:
                  if flavor.lower() not in archive.name.lower():
                      continue
                  with ZipFile(archive) as apk:
                      libraries = set(apk.namelist())
                      for name in ("libSDL3.so", "libSDL3_ttf.so", "libimgui.so"):
                          expected = f"lib/arm64-v8a/{name}"
                          assert expected in libraries, f"Missing submodule-built {expected} in {archive}"
          print("Validated Android ARM64 APKs")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kotonoha-android-arm64-debug
          path: buildsystems/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
