name: WASM vcpkg artifacts

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm-browser:
    name: Compile Emscripten and run Chromium integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install browser and compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config python3 ffmpeg \
            autoconf automake libtool nasm yasm bison flex zip unzip \
            libssl-dev

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "3.1.73"
          actions-cache-folder: emsdk-cache

      - name: Setup pinned vcpkg baseline
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Cache compiled vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: wasm-static-pic-vcpkg-3.1.73-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/ports/**', 'vcpkg-overlays/triplets/**') }}
          restore-keys: |
            wasm-static-pic-vcpkg-3.1.73-

      - name: Verify HTTP Range server before WASM tests
        run: python3 -m unittest discover -s tools -p test_serve_web.py -v

      - name: Guard game-port API boundaries
        run: python3 tools/audit_game_dependencies.py

      - name: Configure Emscripten self-test
        run: |
          mkdir -p vcpkg-binary-cache
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          emcc -v
          # The PIC triplet provides the vcpkg Emscripten wrapper chainload.
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/vcpkg-overlays/triplets" \
            "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg;imgui-vcpkg" \
            -DKOTONOHA_SDL_FROM_VCPKG=ON -DKOTONOHA_IMGUI_FROM_VCPKG=ON \
            -DKOTONOHA_WASM_DYNAMIC_LIBS=ON \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/vcpkg-overlays/ports" \
            -DKOTONOHA_WEB_SELFTEST=ON \
            -DKOTONOHA_BUILD_ALL=ON \
            -DSDLTTF_PLUTOSVG=OFF

      - name: Compile all enabled WASM game ports and self-test
        run: cmake --build build-web --target all --parallel 2

      - name: Check dynamic Kotonoha and static vcpkg module layout
        run: python3 tools/check_wasm_dylink.py build-web/outputs

      - name: Verify Asyncify exports for every generated WASM game
        run: |
          count=0
          while IFS= read -r -d '' js; do
            python3 tools/check_wasm_asyncify.py "$js"
            count=$((count + 1))
          done < <(find build-web/outputs -name '*.js' -type f -print0)
          test "$count" -ge 10
          echo "[Kotonoha] verified $count browser entrypoints"

      - name: Install Playwright Chromium and WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit

      - name: Verify Safari/WebKit and Chromium folder button placement
        run: node tools/web_toolbar_layout.js build-web/outputs/KotonohaWebSelfTest

      - name: Run actual WASM/Chromium regression tests
        run: node tools/web_selftest.js build-web/outputs/KotonohaWebSelfTest

      - name: Launch example gameplay shell with mouse and touch
        run: node tools/web_example_smoke.js build-web/outputs/Kotonoha

      - name: Upload WASM game artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-wasm-vcpkg
          path: build-web/outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-diagnostics
          path: |
            build-web/CMakeFiles/CMakeConfigureLog.yaml
            build-web/CMakeFiles/CMakeError.log
            build-web/outputs/KotonohaWebSelfTest/index.html
          if-no-files-found: ignore

# This workflow validates the generic WASM media/filesystem harness, not
# complete playthroughs of the eleven game ports.
