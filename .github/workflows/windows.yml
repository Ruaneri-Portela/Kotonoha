name: Windows x64 vcpkg artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-vcpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vcpkg-deps:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore prebuilt dependency archives
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-windows-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}
          restore-keys: |
            kotonoha-deps-v2-windows-x64-windows-
      - name: Set up pinned vcpkg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
      - name: Precompile Windows vcpkg packages
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES="clear;files,$env:GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet=x64-windows --x-feature=sdl-vcpkg "--overlay-ports=$env:GITHUB_WORKSPACE/vcpkg-overlays/ports"
      - name: Save finished vcpkg dependency archives
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-windows-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}

  windows:
    needs: vcpkg-deps
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
      - name: Restore vcpkg archives built in the dependency job
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: kotonoha-deps-v2-windows-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/ports/**') }}
          fail-on-cache-miss: true

      - name: Audit build scripts
        shell: pwsh
        run: |
          python tools/ValidateBuildMetadata.py
          python tools/check_sdl_cpack.py
          python tools/audit_filesystem_v2.py --strict
          python tools/check_game_platform_isolation.py
      - name: Configure with vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES="clear;files,$env:GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg" -DKOTONOHA_SDL_PROVIDER=VCPKG -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE/vcpkg-overlays/ports" -DKOTONOHA_BUILD_ALL=ON -DBUILD_TESTING=ON
      - name: Build all game ports
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel 3
      - name: Create ZIP packages
        shell: pwsh
        run: cpack --config build-windows/CPackConfig.cmake -C Release -G ZIP
      - name: Verify ZIP packages
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          packages = sorted(Path("build-windows/packages").glob("*.zip"))
          import json
          expected = len(json.loads(
              Path("buildsystems/xcode/ProjectManifest.json").read_text(
                  encoding="utf-8"))["games"])
          assert len(packages) >= expected, (
              f"Expected at least {expected} game packages, got {len(packages)}"
          )
          for archive in packages:
              with ZipFile(archive) as package:
                  assert package.namelist(), f"Empty archive: {archive}"
          print(f"Validated {len(packages)} Windows game ZIPs")
          '@ | python -

      - name: Upload windows standalone build outputs
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-outputs
          path: build-windows/outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kotonoha CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-Kotonoha
          path: build-windows/packages/*-Kotonoha.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Amagami CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-Amagami
          path: build-windows/packages/*-Amagami.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZeroNoTsukaima CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-ZeroNoTsukaima
          path: build-windows/packages/*-ZeroNoTsukaima.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SnowRadish CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-SnowRadish
          path: build-windows/packages/*-SnowRadish.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SummerRadish CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-SummerRadish
          path: build-windows/packages/*-SummerRadish.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload MEO CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-MEO
          path: build-windows/packages/*-MEO.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload DokiDoki CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-DokiDoki
          path: build-windows/packages/*-DokiDoki.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload KatawaShoujo CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-KatawaShoujo
          path: build-windows/packages/*-KatawaShoujo.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SchoolDays CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-SchoolDays
          path: build-windows/packages/*-SchoolDays.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload RealLive CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-RealLive
          path: build-windows/packages/*-RealLive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kirikiri CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-Kirikiri
          path: build-windows/packages/*-Kirikiri.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload LucaSystem CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-LucaSystem
          path: build-windows/packages/*-LucaSystem.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pmail CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-Pmail
          path: build-windows/packages/*-Pmail.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload PonscripterGame CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-PonscripterGame
          path: build-windows/packages/*-PonscripterGame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload N2SystemGame CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-N2SystemGame
          path: build-windows/packages/*-N2SystemGame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload KotonohaLauncher CPack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-KotonohaLauncher
          path: build-windows/packages/*-KotonohaLauncher.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run synthetic CTest suite (no retail assets)
        id: synthetic-ctest
        continue-on-error: true
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build-windows -C Release -L synthetic --output-on-failure --no-tests=error

      - name: Fail validation if synthetic CTest failed
        if: steps.synthetic-ctest.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::warning::Windows synthetic CTest failed; compiled ZIP artifacts remain available"
          "⚠️ Windows: synthetic CTest failed. See the step logs." >> $env:GITHUB_STEP_SUMMARY
          exit 1
