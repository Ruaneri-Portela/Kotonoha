name: Windows x64 vcpkg artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-vcpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --quiet 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/ports/**') }}
          restore-keys: windows-x64-
      - name: Audit build scripts
        shell: pwsh
        run: |
          python tools/ValidateBuildMetadata.py
          python tools/check_sdl_cpack.py
          python tools/audit_filesystem_v2.py --strict
          python tools/check_game_platform_isolation.py
      - name: Configure with vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-binary-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES="clear;files,$env:GITHUB_WORKSPACE/vcpkg-binary-cache,readwrite"
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DVCPKG_MANIFEST_FEATURES=sdl-vcpkg;imgui-vcpkg" -DKOTONOHA_SDL_FROM_VCPKG=ON -DKOTONOHA_IMGUI_FROM_VCPKG=ON -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE/vcpkg-overlays/ports" -DKOTONOHA_BUILD_ALL=ON -DBUILD_TESTING=ON
      - name: Build all game ports
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel 3
      - name: Run regression tests
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Create ZIP packages
        shell: pwsh
        run: cpack --config build-windows/CPackConfig.cmake -C Release -G ZIP
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kotonoha-windows-x64-vcpkg
          path: |
            build-windows/outputs/
            build-windows/packages/*.zip
          if-no-files-found: error
          retention-days: 14
