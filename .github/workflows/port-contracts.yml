name: Game port startup and compatibility contracts

on:
  pull_request:
    paths:
      - "games/**"
      - "launcher/**"
      - "tools/check_unified_launcher_registry.py"
      - "tools/check_debug_bridge.py"
      - "tools/check_port_debug_contracts.py"
      - "lib/tests/DebugAssetCatalogTests.cpp"
      - "modules/providers/**"
      - "modules/vms/**"
      - "lib/src/debug/**"
      - "lib/include/Kotonoha/debug/**"
      - "lib/src/core/AssetProvider.cpp"
      - "lib/include/Kotonoha/core/AssetProvider.hpp"
      - "lib/include/Kotonoha/core/Runtime.hpp"
      - "lib/tests/AssetProviderTests.cpp"
      - "tools/check_sdl_cpack.py"
      - "tools/check_web_shell.js"
      - "tools/test_em_asm_fetch.js"
      - "tools/check_inline_em_asm.py"
      - "tools/generate_pwa_icons.py"
      - "tools/test_pwa_worker.js"
      - "tools/test_preload_cache.js"
      - "tools/test_web_locales.js"
      - "tools/serve_web.py"
      - "lib/web/**"
      - "buildsystems/cmake/pwa.webmanifest.in"
      - "buildsystems/cmake/service-worker.js.in"
      - "buildsystems/cmake/KotonohaApp.cmake"
      - "tools/web_selftest.js"
      - "buildsystems/cmake/index.html.in"
      - "lib/src/core/WebAssetFetch.cpp"
      - "lib/src/Filesystem/RemoteAssets.cpp"
      - "lib/src/Filesystem/Sources/FetchAssetProvider.cpp"
      - "lib/include/Kotonoha/Filesystem/Sources/FetchAssetProvider.hpp"
      - "lib/tests/web/WebSelfTest.cpp"
      - "tools/test_nested_python_bundle.cmake"
      - "buildsystems/cmake/PruneNestedPythonApp.cmake"
      - "buildsystems/cmake/BundleApp.cmake"
      - "buildsystems/cmake/CheckBundleContents.cmake"
      - "lib/include/Kotonoha/Filesystem/GameSourceProbe.hpp"
      - "lib/tests/GameSourceProbeTests.cpp"
      - "lib/src/core/CommandLine.cpp"
      - "lib/include/Kotonoha/core/Config.hpp"
      - "lib/tests/CommandLineTests.cpp"
      - "modules/providers/n2/**"
      - "tools/ValidateBuildMetadata.py"
      - "docs/PORT_COMPATIBILITY*"
      - "tools/check_release_matrix.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/windows.yml"
      - "buildsystems/xcode/Kotonoha.xcodeproj/**"
      - "buildsystems/cmake/KotonohaGames.cmake"
      - "buildsystems/xcode/ProjectManifest.json"
      - "tools/check_port_contracts.py"
      - ".github/workflows/port-contracts.yml"
  push:
    branches: [dev]
    paths:
      - "games/**"
      - "launcher/**"
      - "tools/check_unified_launcher_registry.py"
      - "tools/check_debug_bridge.py"
      - "tools/check_port_debug_contracts.py"
      - "lib/tests/DebugAssetCatalogTests.cpp"
      - "modules/providers/**"
      - "modules/vms/**"
      - "lib/src/debug/**"
      - "lib/include/Kotonoha/debug/**"
      - "lib/src/core/AssetProvider.cpp"
      - "lib/include/Kotonoha/core/AssetProvider.hpp"
      - "lib/include/Kotonoha/core/Runtime.hpp"
      - "lib/tests/AssetProviderTests.cpp"
      - "tools/check_sdl_cpack.py"
      - "tools/check_web_shell.js"
      - "tools/test_em_asm_fetch.js"
      - "tools/check_inline_em_asm.py"
      - "tools/generate_pwa_icons.py"
      - "tools/test_pwa_worker.js"
      - "tools/test_preload_cache.js"
      - "tools/test_web_locales.js"
      - "tools/serve_web.py"
      - "lib/web/**"
      - "buildsystems/cmake/pwa.webmanifest.in"
      - "buildsystems/cmake/service-worker.js.in"
      - "buildsystems/cmake/KotonohaApp.cmake"
      - "tools/web_selftest.js"
      - "buildsystems/cmake/index.html.in"
      - "lib/src/core/WebAssetFetch.cpp"
      - "lib/src/Filesystem/RemoteAssets.cpp"
      - "lib/src/Filesystem/Sources/FetchAssetProvider.cpp"
      - "lib/include/Kotonoha/Filesystem/Sources/FetchAssetProvider.hpp"
      - "lib/tests/web/WebSelfTest.cpp"
      - "tools/test_nested_python_bundle.cmake"
      - "buildsystems/cmake/PruneNestedPythonApp.cmake"
      - "buildsystems/cmake/BundleApp.cmake"
      - "buildsystems/cmake/CheckBundleContents.cmake"
      - "lib/include/Kotonoha/Filesystem/GameSourceProbe.hpp"
      - "lib/tests/GameSourceProbeTests.cpp"
      - "lib/src/core/CommandLine.cpp"
      - "lib/include/Kotonoha/core/Config.hpp"
      - "lib/tests/CommandLineTests.cpp"
      - "modules/providers/**"
      - "modules/vms/**"
      - "tools/ValidateBuildMetadata.py"
      - "docs/PORT_COMPATIBILITY*"
      - "docs/BUILD_VALIDATION*"
      - "tools/check_release_matrix.py"
      - ".github/workflows/android.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
      - ".github/workflows/windows.yml"
      - "buildsystems/xcode/Kotonoha.xcodeproj/**"
      - "buildsystems/cmake/KotonohaGames.cmake"
      - "buildsystems/xcode/ProjectManifest.json"
      - "tools/check_port_contracts.py"
      - ".github/workflows/port-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate all game port metadata and portable startup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify game manifest and shared input source contracts
        run: |
          python3 tools/check_port_contracts.py
          python3 tools/check_game_platform_isolation.py
          python3 tools/ValidateBuildMetadata.py
          python3 tools/check_release_matrix.py
          python3 tools/check_unified_launcher_registry.py
          python3 tools/check_debug_bridge.py
          python3 tools/check_port_debug_contracts.py
          python3 tools/check_inline_em_asm.py
          python3 tools/check_sdl_cpack.py
      - name: Test common Kotonoha debug asset conventions (C++17)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ilib/include lib/tests/DebugAssetCatalogTests.cpp \
            -o /tmp/kotonoha-debug-assets
          /tmp/kotonoha-debug-assets
      - name: Compile and run N2System script translation catalog regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Imodules/vms/n2system/include \
            modules/vms/n2system/src/ScriptIndex.cpp \
            modules/vms/n2system/src/DebugCatalog.cpp \
            modules/vms/n2system/tests/DebugCatalogTest.cpp \
            -o /tmp/kotonoha-n2-debug-catalog
          /tmp/kotonoha-n2-debug-catalog
      - name: Compile and run standalone N2System VM label regressions
        run: |
          g++ -std=c++17 -Wall -Wextra -pthread \
            -Imodules/vms/n2system/include \
            modules/vms/n2system/src/ScriptIndex.cpp \
            modules/vms/n2system/src/ScriptExecutor.cpp \
            modules/vms/n2system/src/VariableStore.cpp \
            modules/vms/n2system/src/SceneGraph.cpp \
            modules/vms/n2system/src/AudioSystem.cpp \
            modules/vms/n2system/src/DialogueSystem.cpp \
            modules/vms/n2system/src/SaveState.cpp \
            modules/vms/n2system/src/ScriptVm.cpp \
            modules/vms/n2system/tests/ScriptVmTest.cpp \
            -o /tmp/kotonoha-n2-vm
          /tmp/kotonoha-n2-vm
      - name: Compile and run native LucaSystem Debug Catalog regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Igames/luca-system/include \
            games/luca-system/src/DebugCatalog.cpp \
            games/luca-system/tests/DebugCatalogTest.cpp \
            -o /tmp/kotonoha-luca-debug-catalog
          /tmp/kotonoha-luca-debug-catalog
      - name: Verify optional HTTP manifest bootstrap syntax and fallbacks
        run: |
          node tools/check_web_shell.js
          node tools/test_em_asm_fetch.js
          node tools/test_pwa_worker.js
          node tools/test_preload_cache.js
          node tools/test_web_locales.js
          node --check tools/web_selftest.js
      - name: Test nested Python.framework cleanup without macOS SDK
        run: cmake -P tools/test_nested_python_bundle.cmake
