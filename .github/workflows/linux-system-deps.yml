name: Linux system dependency packages

on:
  push:
    branches: [main, dev]
    paths:
      - "CMakeLists.txt"
      - "lib/CMakeLists.txt"
      - "buildsystems/cmake/KotonohaApp.cmake"
      - ".github/workflows/linux-system-deps.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "lib/CMakeLists.txt"
      - "buildsystems/cmake/KotonohaApp.cmake"
      - ".github/workflows/linux-system-deps.yml"

jobs:
  debian-trixie-system-packages:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install system libraries (no SDL/ImGui submodules or vcpkg)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ pkg-config python3 python3-dev \
            libsdl3-dev libsdl3-ttf-dev libimgui-dev \
            libass-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libjson-c-dev \
            libgl-dev libfreetype-dev libharfbuzz-dev zlib1g-dev
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure Kotonoha using only Debian system packages
        run: |
          cmake -S . -B build-system -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKOTONOHA_SDL_PROVIDER=SYSTEM \
            -DKOTONOHA_IMGUI_PROVIDER=SYSTEM \
            -DKOTONOHA_BUILD_EXAMPLE=ON \
            -DKOTONOHA_BUILD_ALL=OFF
          grep -q '^KOTONOHA_SDL_PROVIDER_RESOLVED:INTERNAL=SYSTEM' build-system/CMakeCache.txt
          grep -q '^KOTONOHA_IMGUI_PROVIDER_RESOLVED:INTERNAL=SYSTEM' build-system/CMakeCache.txt
      - name: Build native Example using system libraries
        run: cmake --build build-system --target Kotonoha --parallel 2
